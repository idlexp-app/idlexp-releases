name: 🐛 Relatar um problema (Português)
description: Algo no IdleXP não funciona como deveria
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por avisar. Esta issue é **pública**: não escreva senha, e-mail nem o nome dos seus personagens.
        Problema de segurança? Relate [em particular](https://github.com/idlexp-app/idlexp-releases/security/advisories/new).
  - type: input
    id: versao
    attributes:
      label: Versão do IdleXP
      description: "Aparece na barra de cima do app, ao lado do nome (por exemplo, v0.5.0)."
      placeholder: v0.5.0
    validations:
      required: true
  - type: dropdown
    id: sistema
    attributes:
      label: Sistema
      options:
        - Windows 11
        - Windows 10
        - macOS (Apple Silicon — M1 ou mais novo)
        - macOS (Intel)
        - Linux
        - Outro
    validations:
      required: true
  - type: input
    id: distribuicao
    attributes:
      label: Se for Linux, qual distribuição
      description: "Por exemplo: Ubuntu 24.04, Fedora 40, Arch."
      placeholder: Ubuntu 24.04
  - type: textarea
    id: aconteceu
    attributes:
      label: O que aconteceu
      description: O que você esperava e o que apareceu no lugar.
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Como fazer acontecer de novo
      placeholder: |
        1. Abri o app com 4 telas
        2. Liguei o modo economia na conta 2
        3. ...
  - type: textarea
    id: log
    attributes:
      label: Trecho do diagnóstico (opcional)
      description: |
        O arquivo `diagnostico.log` fica na pasta de dados do app: `%APPDATA%\idlexp` no Windows, `~/Library/Application Support/idlexp` no macOS, `~/.config/idlexp` no Linux. Cole só as linhas do horário do problema e **apague antes os nomes dos seus personagens** — o arquivo guarda esses nomes.
      render: text
